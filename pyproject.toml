[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadfix"]

[project]
name = "roadfix"
version = "0.1.0"
description = "RoadFix — bus-dashcam road-issue detector (SIH26124)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
    "ultralytics>=8.2",
    "supervision>=0.22",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "openai>=1.40",
    "folium>=0.15",
    "streamlit>=1.36",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ultralytics.*,cv2.*,supervision.*,folium.*,streamlit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: end-to-end stub graph runs"]
